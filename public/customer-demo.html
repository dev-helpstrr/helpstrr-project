<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer CRUD Demo - Helpstrr</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .content {
            padding: 30px;
        }
        
        .section {
            margin-bottom: 40px;
            padding: 25px;
            border: 1px solid #e1e5e9;
            border-radius: 10px;
            background: #f8f9fa;
        }
        
        .section h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #feca57 0%, #ff9ff3 100%);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #48dbfb 0%, #0abde3 100%);
        }
        
        .response {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            max-height: 300px;
            overflow-y: auto;
        }
        
        .response.success {
            background: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
        }
        
        .response.error {
            background: #f8d7da;
            border: 1px solid #f5c6cb;
            color: #721c24;
        }
        
        .customers-list {
            display: grid;
            gap: 15px;
        }
        
        .customer-card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .customer-card h3 {
            color: #333;
            margin-bottom: 10px;
        }
        
        .customer-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .info-item {
            display: flex;
            justify-content: space-between;
        }
        
        .info-label {
            font-weight: 600;
            color: #666;
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-active {
            background: #d4edda;
            color: #155724;
        }
        
        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #666;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Customer CRUD Demo</h1>
            <p>Complete Customer Management System with Laravel API</p>
        </div>
        
        <div class="content">
            <!-- Statistics Section -->
            <div class="section">
                <h2>📊 Customer Statistics</h2>
                <button class="btn btn-success" onclick="loadStatistics()">Load Statistics</button>
                <div id="statistics-container"></div>
                <div id="statistics-response" class="response" style="display: none;"></div>
            </div>
            
            <!-- Create Customer Section -->
            <div class="section">
                <h2>➕ Create New Customer</h2>
                <form id="create-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="create-name">Full Name *</label>
                            <input type="text" id="create-name" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="create-email">Email Address *</label>
                            <input type="email" id="create-email" name="email" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="create-phone">Phone Number</label>
                            <input type="tel" id="create-phone" name="phone">
                        </div>
                        <div class="form-group">
                            <label for="create-password">Password *</label>
                            <input type="password" id="create-password" name="password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn">Create Customer</button>
                </form>
                <div id="create-response" class="response" style="display: none;"></div>
            </div>
            
            <!-- List Customers Section -->
            <div class="section">
                <h2>👥 Customer List</h2>
                <button class="btn btn-success" onclick="loadCustomers()">Refresh List</button>
                <button class="btn btn-warning" onclick="bulkActivate()">Bulk Activate</button>
                <button class="btn btn-danger" onclick="bulkDeactivate()">Bulk Deactivate</button>
                <div id="customers-container" class="loading">Click "Refresh List" to load customers</div>
                <div id="list-response" class="response" style="display: none;"></div>
            </div>
            
            <!-- Update Customer Section -->
            <div class="section">
                <h2>✏️ Update Customer</h2>
                <div class="form-group">
                    <label for="update-id">Customer ID *</label>
                    <input type="number" id="update-id" name="id" required placeholder="Enter customer ID">
                </div>
                <form id="update-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="update-name">Full Name</label>
                            <input type="text" id="update-name" name="name">
                        </div>
                        <div class="form-group">
                            <label for="update-phone">Phone Number</label>
                            <input type="tel" id="update-phone" name="phone">
                        </div>
                    </div>
                    <button type="submit" class="btn">Update Customer</button>
                    <button type="button" class="btn btn-warning" onclick="toggleCustomerStatus()">Toggle Status</button>
                    <button type="button" class="btn btn-danger" onclick="deleteCustomer()">Delete Customer</button>
                </form>
                <div id="update-response" class="response" style="display: none;"></div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v1/customer';
        
        // Utility function to make API requests
        async function makeRequest(url, options = {}) {
            try {
                const response = await fetch(url, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json',
                        ...options.headers
                    },
                    ...options
                });
                
                const data = await response.json();
                return { status: response.status, data };
            } catch (error) {
                return { status: 0, data: { message: 'Network error: ' + error.message } };
            }
        }
        
        // Show response in UI
        function showResponse(elementId, response, isSuccess = true) {
            const element = document.getElementById(elementId);
            element.style.display = 'block';
            element.className = `response ${isSuccess ? 'success' : 'error'}`;
            element.textContent = JSON.stringify(response, null, 2);
        }
        
        // Load customer statistics
        async function loadStatistics() {
            const response = await makeRequest(`${API_BASE}/statistics/overview`);
            
            if (response.status === 200) {
                const stats = response.data.data;
                const statsHtml = `
                    <div class="stats-grid">
                        <div class="stat-card">
                            <div class="stat-number">${stats.total_customers}</div>
                            <div class="stat-label">Total Customers</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.active_customers}</div>
                            <div class="stat-label">Active Customers</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.inactive_customers}</div>
                            <div class="stat-label">Inactive Customers</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.customers_with_phone}</div>
                            <div class="stat-label">With Phone</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.customers_today}</div>
                            <div class="stat-label">Registered Today</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-number">${stats.customers_this_month}</div>
                            <div class="stat-label">This Month</div>
                        </div>
                    </div>
                `;
                document.getElementById('statistics-container').innerHTML = statsHtml;
            }
            
            showResponse('statistics-response', response.data, response.status === 200);
        }
        
        // Create customer form handler
        document.getElementById('create-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const customerData = Object.fromEntries(formData.entries());
            
            const response = await makeRequest(API_BASE, {
                method: 'POST',
                body: JSON.stringify(customerData)
            });
            
            showResponse('create-response', response.data, response.status === 201);
            
            if (response.status === 201) {
                e.target.reset();
                loadCustomers(); // Refresh the list
                loadStatistics(); // Refresh statistics
            }
        });
        
        // Load customers list
        async function loadCustomers() {
            document.getElementById('customers-container').innerHTML = '<div class="loading">Loading customers...</div>';
            
            const response = await makeRequest(API_BASE);
            
            if (response.status === 200) {
                const customers = response.data.data.data;
                
                if (customers.length === 0) {
                    document.getElementById('customers-container').innerHTML = '<div class="loading">No customers found</div>';
                } else {
                    const customersHtml = customers.map(customer => `
                        <div class="customer-card">
                            <h3>${customer.display_name} <span class="status-badge status-${customer.is_active ? 'active' : 'inactive'}">${customer.status_text}</span></h3>
                            <div class="customer-info">
                                <div class="info-item">
                                    <span class="info-label">ID:</span>
                                    <span>${customer.id}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Email:</span>
                                    <span>${customer.email}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Phone:</span>
                                    <span>${customer.phone || 'N/A'}</span>
                                </div>
                                <div class="info-item">
                                    <span class="info-label">Created:</span>
                                    <span>${new Date(customer.created_at).toLocaleDateString()}</span>
                                </div>
                            </div>
                            <button class="btn" onclick="loadCustomerDetails(${customer.id})">View Details</button>
                            <button class="btn btn-warning" onclick="fillUpdateForm(${customer.id}, '${customer.name}', '${customer.phone || ''}')">Edit</button>
                        </div>
                    `).join('');
                    
                    document.getElementById('customers-container').innerHTML = `<div class="customers-list">${customersHtml}</div>`;
                }
            } else {
                document.getElementById('customers-container').innerHTML = '<div class="loading">Error loading customers</div>';
            }
            
            showResponse('list-response', response.data, response.status === 200);
        }
        
        // Load specific customer details
        async function loadCustomerDetails(id) {
            const response = await makeRequest(`${API_BASE}/${id}`);
            showResponse('list-response', response.data, response.status === 200);
        }
        
        // Fill update form with customer data
        function fillUpdateForm(id, name, phone) {
            document.getElementById('update-id').value = id;
            document.getElementById('update-name').value = name;
            document.getElementById('update-phone').value = phone;
        }
        
        // Update customer form handler
        document.getElementById('update-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const id = document.getElementById('update-id').value;
            if (!id) {
                alert('Please enter a customer ID');
                return;
            }
            
            const formData = new FormData(e.target);
            const customerData = Object.fromEntries(formData.entries());
            
            // Remove empty values
            Object.keys(customerData).forEach(key => {
                if (!customerData[key]) delete customerData[key];
            });
            
            const response = await makeRequest(`${API_BASE}/${id}`, {
                method: 'PUT',
                body: JSON.stringify(customerData)
            });
            
            showResponse('update-response', response.data, response.status === 200);
            
            if (response.status === 200) {
                loadCustomers(); // Refresh the list
            }
        });
        
        // Toggle customer status
        async function toggleCustomerStatus() {
            const id = document.getElementById('update-id').value;
            if (!id) {
                alert('Please enter a customer ID');
                return;
            }
            
            const response = await makeRequest(`${API_BASE}/${id}/toggle-status`, {
                method: 'PATCH'
            });
            
            showResponse('update-response', response.data, response.status === 200);
            
            if (response.status === 200) {
                loadCustomers(); // Refresh the list
                loadStatistics(); // Refresh statistics
            }
        }
        
        // Delete customer
        async function deleteCustomer() {
            const id = document.getElementById('update-id').value;
            if (!id) {
                alert('Please enter a customer ID');
                return;
            }
            
            if (!confirm('Are you sure you want to delete this customer?')) {
                return;
            }
            
            const response = await makeRequest(`${API_BASE}/${id}`, {
                method: 'DELETE'
            });
            
            showResponse('update-response', response.data, response.status === 200);
            
            if (response.status === 200) {
                document.getElementById('update-form').reset();
                document.getElementById('update-id').value = '';
                loadCustomers(); // Refresh the list
                loadStatistics(); // Refresh statistics
            }
        }
        
        // Bulk activate customers
        async function bulkActivate() {
            const response = await makeRequest(`${API_BASE}/bulk-action`, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'activate',
                    customer_ids: 'all'
                })
            });
            
            showResponse('list-response', response.data, response.status === 200);
            
            if (response.status === 200) {
                loadCustomers();
                loadStatistics();
            }
        }
        
        // Bulk deactivate customers
        async function bulkDeactivate() {
            const response = await makeRequest(`${API_BASE}/bulk-action`, {
                method: 'POST',
                body: JSON.stringify({
                    action: 'deactivate',
                    customer_ids: 'all'
                })
            });
            
            showResponse('list-response', response.data, response.status === 200);
            
            if (response.status === 200) {
                loadCustomers();
                loadStatistics();
            }
        }
        
        // Load initial data
        document.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
            loadCustomers();
        });
    </script>
</body>
</html>
